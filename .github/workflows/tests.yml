# Test the emulator workspace.
#
# Deliberately *not* triggered on push: the Android build is manual-only and the
# test suite runs on pull requests and on demand, so a branch under construction
# does not queue a runner for every commit.
name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  # Plain logs: the tail is posted to the pull request, where ANSI escapes are
  # noise.
  CARGO_TERM_COLOR: never

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emulator
    steps:
      - uses: actions/checkout@v4

      # The workspace has no third-party dependencies, so there is no registry
      # fetch to warm; the cache step just keeps the compiled crates.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: emulator

      - name: Build and test
        id: build
        run: |
          set -uo pipefail
          status=0
          echo "== toolchain" | tee -a /tmp/ci.log
          { rustc --version; cargo --version; } 2>&1 | tee -a /tmp/ci.log
          # --keep-going so one broken crate does not hide the errors in the
          # next one; every problem shows up in a single run.
          echo "== cargo build --workspace --all-targets --keep-going" | tee -a /tmp/ci.log
          cargo build --workspace --all-targets --keep-going 2>&1 | tee -a /tmp/ci.log || status=1
          echo "== cargo test --workspace" | tee -a /tmp/ci.log
          cargo test --workspace --keep-going 2>&1 | tee -a /tmp/ci.log || status=1
          echo "== cargo build --workspace --release" | tee -a /tmp/ci.log
          cargo build --workspace --release 2>&1 | tee -a /tmp/ci.log || status=1
          exit $status

      # The log tail is posted to the pull request so a failure can be read
      # without opening the Actions log viewer.
      - name: Report the result on the pull request
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          {
            echo "### \`cargo test\` — $OUTCOME"
            echo
            echo '```'
            grep -E '^(test result|running|error|warning|error\[)' /tmp/ci.log | tail -60
            echo '```'
            if [ "$OUTCOME" != success ]; then
              echo
              echo '<details><summary>last 250 lines</summary>'
              echo
              echo '```'
              tail -250 /tmp/ci.log
              echo '```'
              echo
              echo '</details>'
            fi
          } > /tmp/body.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/body.md
