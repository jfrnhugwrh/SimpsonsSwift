# Test the emulator workspace.
#
# Deliberately *not* triggered on push: the Android build is manual-only and the
# test suite runs on pull requests and on demand, so a branch under construction
# does not queue a runner for every commit.
name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emulator
    steps:
      - uses: actions/checkout@v4

      # The workspace has no third-party dependencies, so there is no registry
      # fetch to warm; the cache step just keeps the compiled crates.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: emulator

      - name: Build and test
        id: build
        run: |
          set -uo pipefail
          {
            echo "== toolchain"
            rustc --version
            cargo --version
            echo
            echo "== cargo build --workspace --all-targets"
            cargo build --workspace --all-targets
            echo
            echo "== cargo test --workspace"
            cargo test --workspace
            echo
            echo "== cargo build --workspace --release"
            cargo build --workspace --release
          } 2>&1 | tee /tmp/ci.log

      # The log tail is posted to the pull request so a failure can be read
      # without opening the Actions log viewer.
      - name: Report the result on the pull request
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          {
            echo "### \`cargo test\` — $OUTCOME"
            echo
            echo '```'
            grep -E '^(test result|running|error|warning: unused|error\[)' /tmp/ci.log | tail -40
            echo '```'
            if [ "$OUTCOME" != success ]; then
              echo
              echo '<details><summary>last 250 lines</summary>'
              echo
              echo '```'
              tail -250 /tmp/ci.log
              echo '```'
              echo
              echo '</details>'
            fi
          } > /tmp/body.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/body.md
