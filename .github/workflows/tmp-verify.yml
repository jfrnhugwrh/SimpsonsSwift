name: Temp compile verification

on:
  push:
    branches: ['arena/01a10d2e-simpsonsswift']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: 'true'

jobs:
  cargo-test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: emulator
      - name: Test the Rust workspace
        run: cargo test --manifest-path emulator/Cargo.toml --locked --offline --workspace
