name: Temp compile verification

on:
  push:
    branches: ['arena/01a10d2e-simpsonsswift']

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: never
  CARGO_NET_OFFLINE: 'true'

jobs:
  cargo-test:
    name: cargo check + test workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: emulator

      - name: cargo check
        run: |
          set -o pipefail
          (cd emulator && cargo check --workspace --all-targets --locked --offline) 2>&1 | tee /tmp/check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 .github/scripts/surface-log.py /tmp/check.log "CHECK"
            exit "$status"
          fi

      - name: cargo test
        run: |
          set -o pipefail
          (cd emulator && cargo test --workspace --locked --offline) 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 .github/scripts/surface-log.py /tmp/test.log "TEST"
            exit "$status"
          fi
