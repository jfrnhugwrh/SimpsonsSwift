name: Android APK

on:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'android/**'
      - 'emulator/**'
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'android/**'
      - 'emulator/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: 'true'
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_API_LEVEL: '23'

jobs:
  build-apk:
    name: Build installable universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          # setup-android splits `packages` on spaces only (never on newlines), so
          # this must stay on one line. A YAML block scalar here makes sdkmanager
          # look for a single package literally named "platform-tools\nplatforms;...".
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: emulator

      - name: Test the Rust workspace
        run: cargo test --manifest-path emulator/Cargo.toml --locked --offline --workspace

      - name: Configure NDK linkers
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$sdk" && -d "$sdk" ]] || { echo "::error::Android SDK path is not set"; exit 1; }
          ndk="$sdk/ndk/$ANDROID_NDK_VERSION"
          if [[ ! -d "$ndk" ]]; then
            ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          fi
          [[ -n "$ndk" && -d "$ndk/toolchains/llvm/prebuilt" ]] || {
            echo "::error::Android NDK $ANDROID_NDK_VERSION was not installed"
            exit 1
          }

          host="$(find "$ndk/toolchains/llvm/prebuilt" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' -quit)"
          [[ -n "$host" ]] || { echo "::error::NDK host toolchain not found"; exit 1; }
          bin="$ndk/toolchains/llvm/prebuilt/$host/bin"

          # Rust target linkers are the NDK's API-level-aware clang wrappers.
          declare -A linkers=(
            [AARCH64_LINUX_ANDROID]="$bin/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
            [ARMV7_LINUX_ANDROIDEABI]="$bin/armv7a-linux-androideabi${ANDROID_API_LEVEL}-clang"
            [X86_64_LINUX_ANDROID]="$bin/x86_64-linux-android${ANDROID_API_LEVEL}-clang"
            [I686_LINUX_ANDROID]="$bin/i686-linux-android${ANDROID_API_LEVEL}-clang"
          )
          for target in "${!linkers[@]}"; do
            linker="${linkers[$target]}"
            [[ -x "$linker" ]] || { echo "::error::NDK linker not found: $linker"; exit 1; }
            echo "CARGO_TARGET_${target}_LINKER=$linker" >> "$GITHUB_ENV"
          done
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "NDK_BIN=$bin" >> "$GITHUB_ENV"
          echo "Using NDK $ndk ($host), Android API $ANDROID_API_LEVEL"

      - name: Build and stage the Rust emulator for all Android ABIs
        shell: bash
        run: |
          set -euo pipefail
          # Keep ELF load segments compatible with 16 KiB-page Android devices.
          export RUSTFLAGS='-C link-arg=-Wl,-z,max-page-size=16384'
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android

          declare -A targets=(
            [arm64-v8a]=aarch64-linux-android
            [armeabi-v7a]=armv7-linux-androideabi
            [x86_64]=x86_64-linux-android
            [x86]=i686-linux-android
          )
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            target="${targets[$abi]}"
            echo "Building simpsons-emu for $abi ($target)"
            cargo build \
              --manifest-path emulator/Cargo.toml \
              --locked --offline --release \
              --package cli --bin simpsons-emu \
              --target "$target"

            source="emulator/target/$target/release/simpsons-emu"
            destination="android/app/src/main/jniLibs/$abi/libsimpsons-emu.so"
            test -s "$source"
            mkdir -p "$(dirname "$destination")"
            cp "$source" "$destination"
            chmod 755 "$destination"
            "$NDK_BIN/llvm-strip" --strip-unneeded "$destination"
            file "$destination"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build the signed APK
        run: gradle --no-daemon --stacktrace --max-workers=2 -p android :app:assembleRelease

      - name: Verify and name the APK
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          output="android/app/build/outputs/apk/release/SimpsonsSwift-android-universal.apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$sdk" && -d "$sdk/build-tools/35.0.0" ]] || {
            echo "::error::Android build-tools 35.0.0 were not installed"
            exit 1
          }
          apksigner="$sdk/build-tools/35.0.0/apksigner"
          aapt="$sdk/build-tools/35.0.0/aapt"

          test -s "$apk" || { echo "::error::Gradle did not produce $apk"; exit 1; }
          "$apksigner" verify --verbose "$apk"
          "$aapt" dump badging "$apk" > apk-badging.txt
          grep -q '^launchable-activity:' apk-badging.txt || {
            echo "::error::APK has no launcher activity"
            cat apk-badging.txt
            exit 1
          }
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libsimpsons-emu.so" >/dev/null || {
              echo "::error::APK is missing the Rust executable for $abi"
              exit 1
            }
          done

          cp "$apk" "$output"
          sha256sum "$output"
          {
            echo '### Android APK'
            echo
            echo 'Built and signature-verified a universal, sideloadable APK for arm64-v8a, armeabi-v7a, x86_64 and x86.'
            echo
            echo 'The APK includes the emulator only. Import your own decrypted game IPA after installing it.'
            echo
            echo "SHA-256: \`$(sha256sum "$output" | cut -d ' ' -f 1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: SimpsonsSwift-android-apk
          path: android/app/build/outputs/apk/release/SimpsonsSwift-android-universal.apk
          if-no-files-found: error
          retention-days: 30
